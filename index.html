<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Shop Thiết Bị Y Tế</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f9f9f9; color: #333; }

    header {
      background: #1565C0;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin-bottom: 10px; }

    nav {
      background: #1E88E5;
      display: flex;
      justify-content: center;
    }
    nav a {
      color: white;
      padding: 14px 20px;
      text-decoration: none;
    }
    nav a:hover { background: #0D47A1; }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 20px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      padding: 15px;
      text-align: center;
    }

    .product img {
      max-width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
    }

    .product h3 { margin: 10px 0; }
    .product p { margin: 10px 0; }

    .price { font-weight: bold; color: #1565C0; }

    button {
      background: #1565C0;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #0D47A1; }

    #cart {
      margin-top: 40px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }
    th {
      background: #1565C0;
      color: white;
    }

    #total {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      color: #1565C0;
    }

    #qr {
      margin-top: 20px;
      text-align: center;
      display: none;
    }
    #qr img {
      width: 200px;
      height: 200px;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Phạm Minh Quân</h1>
    <p>Mã số: 2516030113</p>
  </header>

  <nav>
    <a href="#">Trang chủ</a>
    <a href="#">Sản phẩm</a>
    <a href="#">Liên hệ</a>
  </nav>

  <div class="container">
    <h2>Thiết bị y tế nổi bật</h2>
    <div class="products" id="product-list"></div>

    <div id="cart">
      <h2>Giỏ hàng</h2>
      <table>
        <thead>
          <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
            <th>Xóa</th>
          </tr>
        </thead>
        <tbody id="cart-items"></tbody>
      </table>
      <div id="total">Tổng: 0đ</div>
      <button onclick="checkout()">Thanh toán</button>
      <div id="qr">
        <p>Quét mã QR để thanh toán:</p>
        <img src="https://kommodo.ai/i/k4I9iS66m4nYOtJGNabI" alt="Mã QR thanh toán" width="250">
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Shop Thiết Bị Y Tế - Hotline: 0978539281</p>
  </footer>

  <script>
    const products = [
      { name: "Máy đo huyết áp", desc: "Đo huyết áp nhanh chóng, chính xác.", price: 850000, img: "https://th.bing.com/th/id/OIP.5GzGe10zXqmpSaqR0yudEgHaIq?w=158&h=185&c=7&r=0&o=7&pid=1.7&rm=3" },
      { name: "Nhiệt kế điện tử", desc: "Đo nhiệt độ cơ thể tiện lợi.", price: 250000, img: "https://th.bing.com/th/id/OIP.DZwMlWrrXSmV9x8cxRfqzQHaHO?w=186&h=182&c=7&r=0&o=7&pid=1.7&rm=3" },
      { name: "Máy đo đường huyết", desc: "Theo dõi đường huyết tại nhà.", price: 1200000, img: "https://th.bing.com/th/id/OIP.hDlBzWz_2wdQ5xRr6ORAqQHaHa?w=181&h=181&c=7&r=0&o=7&pid=1.7&rm=3" },
      { name: "Máy xông khí dung", desc: "Hỗ trợ điều trị bệnh hô hấp.", price: 650000, img: "https://th.bing.com/th/id/OIP.p5MGSLpUraigwd-EuPIeNgHaHa?w=200&h=200&c=7&r=0&o=7&pid=1.7&rm=3" }
    ];

    const productList = document.getElementById("product-list");
    const cartItems = document.getElementById("cart-items");
    const totalDiv = document.getElementById("total");
    const qrDiv = document.getElementById("qr");
    let cart = [];

    function renderProducts() {
      products.forEach((p, index) => {
        const div = document.createElement("div");
        div.className = "product";
        div.innerHTML = `
          <img src="${p.img}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <p class="price">${p.price.toLocaleString()}đ</p>
          <button onclick="addToCart(${index})">Thêm vào giỏ</button>
        `;
        productList.appendChild(div);
      });
    }

    function addToCart(index) {
      const product = products[index];
      const existing = cart.find(item => item.name === product.name);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...product, qty: 1 });
      }
      renderCart();
    }

    function removeFromCart(name) {
      cart = cart.filter(item => item.name !== name);
      renderCart();
    }

    function renderCart() {
      cartItems.innerHTML = "";
      let total = 0;
      cart.forEach(item => {
        total += item.price * item.qty;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.name}</td>
          <td>${item.price.toLocaleString()}đ</td>
          <td>${item.qty}</td>
          <td><button onclick="removeFromCart('${item.name}')">Xóa</button></td>
        `;
        cartItems.appendChild(tr);
      });
      totalDiv.textContent = "Tổng: " + total.toLocaleString() + "đ";
    }

    function checkout() {
      if (cart.length === 0) {
        alert("Giỏ hàng trống!");
        return;
      }
      qrDiv.style.display = "block";
    }

    renderProducts();
  </script>
</body>
</html>
